user  nginx;
worker_processes auto;
# A worker must not inherit a stale resolver or fd set after a reload.
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Not announcing the exact version is free; it removes half of the
    # fingerprinting a scanner relies on.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_iso8601] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'uct="$upstream_connect_time" urt="$upstream_response_time" '
                    'trace=$upstream_http_x_trace_id';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Uploads are capped here as well as in the application: the proxy is the
    # first thing a large body hits, so rejecting it here is cheapest.
    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Only add HSTS when the connection is actually TLS. Nginx skips an
    # add_header whose value is empty, so the mapping below is enough.
    map $scheme $hsts_header {
        https    "max-age=31536000; includeSubDomains";
        default  "";
    }

    include /etc/nginx/conf.d/*.conf;
}
