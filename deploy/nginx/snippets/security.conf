# Browser security headers for responses that never reach the application -
# the SPA assets served straight from nginx. The API adds its own set, driven
# by Settings, so nothing here needs to be configured twice.
#
# ``$hsts_header`` is mapped in nginx.conf and is empty on plain HTTP, so the
# header simply is not sent until TLS is live.

add_header X-Content-Type-Options    "nosniff"                          always;
add_header X-Frame-Options           "SAMEORIGIN"                       always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security $hsts_header                       always;
add_header X-XSS-Protection          "0"                                always;
