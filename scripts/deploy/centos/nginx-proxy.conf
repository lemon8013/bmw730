# Shared reverse proxy directives for the bare metal nginx site.
#
#   cp scripts/deploy/centos/nginx-proxy.conf /etc/nginx/conf.d/vctn-proxy.conf
#   # then, inside each `location /api/` block of nginx-vctn.conf:
#   #   include /etc/nginx/conf.d/vctn-proxy.conf;
#
# Kept in one file so that the four frontends forward identical headers. A
# header set on one host and forgotten on another produces bugs that only
# reproduce for some users - the proxy fields decide what the application sees
# as the client IP, the scheme and the original Host.

proxy_http_version  1.1;
proxy_set_header    Host              $host;
proxy_set_header    X-Real-IP         $remote_addr;
proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header    X-Forwarded-Proto $scheme;
proxy_set_header    X-Forwarded-Host  $host;
proxy_set_header    Connection        "";
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
