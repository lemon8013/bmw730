# Bare metal nginx site for VCTN (CentOS / Rocky / AlmaLinux).
#
#   cp scripts/deploy/centos/nginx-vctn.conf /etc/nginx/conf.d/vctn.conf
#   # replace every *.example.com with the real host names, then:
#   nginx -t && systemctl reload nginx
#
# The container route does not use this file: docker-compose.yml ships its own
# gateway that renders deploy/nginx/templates instead.
#
# Two things in here are load bearing:
#   * `location /api/` - every frontend calls /api/v1 relatively. Without this
#     block the SPA renders and then every request 404s, which looks like a CORS
#     bug and is not one.
#   * `try_files ... /index.html` - an SPA route refreshed directly has no file
#     on disk, so it must fall back to the shell.
#
# SELinux note: proxying to 127.0.0.1:8000 is denied until you run
#   setsebool -P httpd_can_network_connect 1

upstream api_backend { server 127.0.0.1:8000 max_fails=3 fail_timeout=10s; }

map $scheme $hsts_header {
    https    "max-age=31536000; includeSubDomains";
    default  "";
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com admin.example.com tools.example.com www.example.com ops.example.com;
    return 301 https://$host$request_uri;
}

# Anything that is not a known host gets no answer at all, so a scan by IP
# cannot reach a frontend.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;

    location /health  { proxy_pass http://api_backend; access_log off; }
    location /ready   { proxy_pass http://api_backend; access_log off; }
    location /version { proxy_pass http://api_backend; access_log off; }

    location / {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# Every frontend needs the same two blocks, so they are written out once per
# host rather than shared: a shared snippet hides which root belongs to which
# host, and that is exactly what goes wrong at 3 a.m.
server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /srv/vctn/app/deploy/centos/www/admin;
    index index.html;

    location /health  { proxy_pass http://api_backend; access_log off; }
    location /ready   { proxy_pass http://api_backend; access_log off; }
    location /version { proxy_pass http://api_backend; access_log off; }

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets carry a content hash, so they can be cached hard; the shell
    # cannot, otherwise a deploy serves the old entry point for a day.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# Duplicate the block above for the remaining frontends, changing:
#   server_name                 tools.example.com / www.example.com / ops.example.com
#   ssl_certificate(_key)       the matching certificate
#   root                        .../www/tools | .../www/blog | .../www/ops
