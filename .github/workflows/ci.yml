name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to the same branch makes older runs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vctn_ci
          POSTGRES_USER: vctn
          POSTGRES_PASSWORD: vctn
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=zh-CN"
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: vctn_ci
      DB_USER: vctn
      DB_PASSWORD: vctn
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      AUTH_JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: vctn-api/requirements.lock.txt

      - name: Install dependencies
        working-directory: vctn-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Lint
        working-directory: vctn-api
        run: python -m ruff check app tests scripts

      - name: Apply migrations
        working-directory: vctn-api
        run: python -m alembic upgrade head

      - name: Test
        working-directory: vctn-api
        run: python -m pytest -q

  frontend:
    name: frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, tools, blog, ops]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vctn-${{ matrix.app }}-web/package-lock.json

      - name: Install
        working-directory: vctn-${{ matrix.app }}-web
        run: npm ci

      - name: Lint
        working-directory: vctn-${{ matrix.app }}-web
        run: npx eslint . --max-warnings 0

      - name: Build (runs vue-tsc --noEmit first)
        working-directory: vctn-${{ matrix.app }}-web
        run: npm run build

  compose:
    name: compose config
    runs-on: ubuntu-latest

    env:
      ADMIN_HOST: admin.example.com
      TOOLS_HOST: tools.example.com
      BLOG_HOST: www.example.com
      OPS_HOST: ops.example.com
      API_HOST: api.example.com
      ALLOWED_HOSTS: admin.example.com,api.example.com
      CORS_ORIGINS: https://admin.example.com
      AUTH_JWT_SECRET: ci-only-not-a-real-secret
      DB_PASSWORD: vctn
      # Required by the object storage service; `docker compose config` fails
      # the PR if a `${VAR:?...}` placeholder has no value.
      S3_ACCESS_KEY: ci-only
      S3_SECRET_KEY: ci-only-not-a-real-secret
      RUSTFS_CORS_ALLOWED_ORIGINS: https://admin.example.com

    steps:
      - uses: actions/checkout@v4

      # Interpolation errors are invisible until `up` is run, and `${VAR:?msg}`
      # only fires then too. Validating here means a missing variable fails the
      # pull request instead of the deployment.
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.managed.yml
        run: docker compose -f docker-compose.managed.yml config --quiet

  images:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: vctn-api
          - image: admin-web
            context: vctn-admin-web
          - image: tools-web
            context: vctn-tools-web
          - image: blog-web
            context: vctn-blog-web
          - image: ops-web
            context: vctn-ops-web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A Dockerfile that has never been built is not a Dockerfile. This job
      # exists because a broken image is only discovered at deploy time
      # otherwise - the worst possible moment.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: vctn-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
