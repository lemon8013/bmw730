# Serves the built SPA. All API traffic is handled by the gateway, so this
# server only ever sees static file requests.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset names, so these are safe to cache for a
    # year. index.html is never cached: it is what points at new assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Client side routing: any unknown path is handed back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
