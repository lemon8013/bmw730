[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revisions are created with an explicit sequential id, e.g.
#   alembic revision --autogenerate -m "initial schema" --rev-id 0001
file_template = %%(rev)s_%%(slug)s
# The URL is injected from application settings by migrations/env.py.
# Credentials are never stored in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
