# Managed database deployment: the same stack, but PostgreSQL and Redis are
# external (RDS / Cloud SQL / ElastiCache / a DBA managed cluster).
#
#   cp deploy/.env.deploy.example .env   # then fill it in
#   docker compose -f docker-compose.managed.yml run --rm api migrate
#   docker compose -f docker-compose.managed.yml up -d
#
# Why a separate file rather than a profile: the health checks and the
# `depends_on` graph differ, and a half started database is worse than no
# database at all.

services:
  api:
    build:
      context: ./vctn-api
    image: vctn-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      CORS_ALLOW_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOW_HEADERS: "Authorization,Content-Type,X-Trace-ID,X-Request-ID"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-true}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      # Either the split fields or a complete DATABASE_URL. The split fields
      # avoid escaping special characters in the password inside a URL.
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Every replica must carry a different node id or the generated primary
      # keys collide silently. Scale out by pinning one id per replica.
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-0}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILE_STORAGE_ROOT: /var/lib/vctn/storage
      EXPORT_STORAGE_ROOT: /var/lib/vctn/exports
      # Object storage. This file has no RustFS service, because a managed
      # deployment normally already has an S3 endpoint; point these at it.
      # Leaving FILE_STORAGE_PROVIDER=local is only safe with one replica.
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      # A managed endpoint is https; RustFS behind a TLS proxy is too.
      S3_SECURE: ${S3_SECURE:-true}
      S3_PREFIX: ${S3_PREFIX:-}
      # `virtual` suits AWS S3 / R2 / a bucket as a hostname; `path` suits
      # RustFS and MinIO reached by a bare host.
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-virtual}
      # A managed bucket is created out of band; do not let the app try.
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-false}
      S3_VERIFY_TLS: ${S3_VERIFY_TLS:-true}
    volumes:
      - storage:/var/lib/vctn/storage
      - exports:/var/lib/vctn/exports
    networks:
      - frontend
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

  web-admin:
    build:
      context: ./vctn-admin-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: vctn-admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  web-tools:
    build:
      context: ./vctn-tools-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: vctn-tools-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  web-blog:
    build:
      context: ./vctn-blog-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: vctn-blog-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  web-ops:
    build:
      context: ./vctn-ops-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: vctn-ops-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST is required}
      TOOLS_HOST: ${TOOLS_HOST:?TOOLS_HOST is required}
      BLOG_HOST: ${BLOG_HOST:?BLOG_HOST is required}
      OPS_HOST: ${OPS_HOST:?OPS_HOST is required}
      API_HOST: ${API_HOST:?API_HOST is required}
    volumes:
      - ./deploy/nginx/templates/vctn.https.conf.template:/etc/nginx/templates/vctn.conf.template:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot
    depends_on:
      - api
      - web-admin
      - web-tools
      - web-blog
      - web-ops
    networks:
      - frontend
    logging: *default-logging

networks:
  frontend:

volumes:
  storage:
  exports:
  certbot-webroot:
