# Single host deployment: the whole stack including PostgreSQL and Redis.
#
# Use this for a pilot, a small installation, or to prove the deployment on a
# fresh machine. For a managed database see docker-compose.managed.yml.
#
#   cp deploy/.env.deploy.example .env   # then fill it in
#   docker compose run --rm api migrate  # apply migrations
#   docker compose run --rm api seed --mode=system
#   docker compose up -d
#
# The four frontends must be built first:
#   (cd vctn-admin-web && npm ci && npm run build)   # and the other three

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-vctn}
      POSTGRES_USER: ${DB_USER:-vctn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # The collation provider matters: icu gives stable ordering for the
      # Chinese text this schema stores, and it must be chosen at initdb.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=zh-CN"
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vctn} -d ${DB_NAME:-vctn}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    logging: *default-logging

  # Object storage for every uploaded file and image: RustFS, an Apache 2.0
  # S3 compatible server. Pin RUSTFS_IMAGE to a tag or a digest before going
  # live - `latest` is fine for a pilot and wrong for an audit.
  #
  # Nothing is published to the host: only `api` talks to RustFS, on the private
  # backend network. To reach the console temporarily, use an SSH tunnel
  # (`ssh -L 9001:rustfs:9001`), never a published 0.0.0.0 port.
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    restart: unless-stopped
    depends_on:
      rustfs-chown:
        condition: service_completed_successfully
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # The management console uploads straight from the browser (pre-signed
      # PUT), so the S3 API has to answer CORS. Narrow this to the admin
      # origin - `*` is a placeholder, not a recommendation.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    volumes:
      - rustfsdata:/data
      - rustfslogs:/app/logs
    # The application should not hold the root credential. RustFS serves a
    # single credential pair here, so treat it as the service account and
    # rotate it; never reuse it for anything else.
    networks:
      - backend
    healthcheck:
      # RustFS exposes /health on the API port. The API waits on this before
      # it tries to create the bucket.
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # RustFS runs as uid/gid 10001. A brand new named volume is root owned and
  # the server would fail on its first write, so the ownership is fixed once
  # before the server starts (this is what the upstream compose file does).
  rustfs-chown:
    image: alpine
    restart: "no"
    command: >
      sh -c "chown -R 10001:10001 /data /app/logs &&
             echo 'volume permissions fixed' &&
             exit 0"
    volumes:
      - rustfsdata:/data
      - rustfslogs:/app/logs
    logging: *default-logging

  api:
    build:
      context: ./vctn-api
    image: vctn-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # The entrypoint defaults to "serve". Override it with `docker compose run`
    # to migrate, seed or purge without starting the HTTP server.
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      # Production refuses to start without these, on purpose.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      CORS_ALLOW_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOW_HEADERS: "Authorization,Content-Type,X-Trace-ID,X-Request-ID"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      SECURITY_HSTS_ENABLED: ${SECURITY_HSTS_ENABLED:-false}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-vctn}
      DB_USER: ${DB_USER:-vctn}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # A single API container per node keeps the Snowflake node id unique.
      # Raise UVICORN_WORKERS only after moving scheduled work out of process.
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-0}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FILE_STORAGE_ROOT: /var/lib/vctn/storage
      EXPORT_STORAGE_ROOT: /var/lib/vctn/exports
      # Object storage. Every uploaded file and image goes here as soon as
      # FILE_STORAGE_PROVIDER=s3 (or `rustfs`); leave it as `local` only for a
      # single node, because each replica would otherwise keep its own copy.
      FILE_STORAGE_PROVIDER: ${FILE_STORAGE_PROVIDER:-rustfs}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-vctn}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_SECURE: ${S3_SECURE:-false}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-}
      # Path style works with a bare hostname; virtual style would need a
      # wildcard DNS record for *.rustfs.
      S3_ADDRESSING_STYLE: path
      S3_AUTO_CREATE_BUCKET: ${S3_AUTO_CREATE_BUCKET:-true}
      S3_VERIFY_TLS: ${S3_VERIFY_TLS:-false}
      # Periodic ops work: rollups, alert evaluation, probes and the retention
      # purge. Off in Settings by default, so it has to be turned on here or the
      # console never fills up. Safe with several replicas: each tick takes an
      # advisory lock and the losers skip instead of duplicating the work.
      OPS_SCHEDULER_ENABLED: ${OPS_SCHEDULER_ENABLED:-true}
      OPS_SELF_MONITOR_ENABLED: ${OPS_SELF_MONITOR_ENABLED:-true}
      # Inside the compose network the API is reachable by its service name.
      OPS_SELF_MONITOR_URL: ${OPS_SELF_MONITOR_URL:-http://api:8000/health}
    volumes:
      - storage:/var/lib/vctn/storage
      - exports:/var/lib/vctn/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - backend
      - frontend
    logging: *default-logging

  web-admin:
    build:
      context: ./vctn-admin-web
      args:
        VITE_API_BASE_URL: /api/v1
    image: vctn-admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  web-tools:
    build:
      context: ./vctn-tools-web
      args:
        VITE_API_BASE_URL: /api/v1
    image: vctn-tools-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  web-blog:
    build:
      context: ./vctn-blog-web
      args:
        VITE_API_BASE_URL: /api/v1
    image: vctn-blog-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  web-ops:
    build:
      context: ./vctn-ops-web
      args:
        VITE_API_BASE_URL: /api/v1
    image: vctn-ops-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [frontend]
    logging: *default-logging

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?ADMIN_HOST is required}
      TOOLS_HOST: ${TOOLS_HOST:?TOOLS_HOST is required}
      BLOG_HOST: ${BLOG_HOST:?BLOG_HOST is required}
      OPS_HOST: ${OPS_HOST:?OPS_HOST is required}
      API_HOST: ${API_HOST:?API_HOST is required}
    volumes:
      # The official image renders *.template into /etc/nginx/conf.d on start.
      - ./deploy/nginx/templates/vctn.http.conf.template:/etc/nginx/templates/vctn.conf.template:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - api
      - web-admin
      - web-tools
      - web-blog
      - web-ops
    networks:
      - frontend
      - backend
    logging: *default-logging

networks:
  frontend:
  # Deliberately not `internal`: the ops notification dispatcher sends Webhooks
  # to external endpoints, and an internal network has no route out.
  backend:

volumes:
  pgdata:
  redisdata:
  rustfsdata:
  rustfslogs:
  # Kept for the `local` provider. With FILE_STORAGE_PROVIDER=s3 they hold
  # nothing and can be removed together with `FILE_STORAGE_ROOT`.
  storage:
  exports:
